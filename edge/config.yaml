# Edge worker configuration.
#
# One worker per camera. Ingest keys are NOT stored here: they are generated by
# `python -m core.seed` and written to secrets/edge_credentials.json (mode 0600, gitignored).
# The runner merges them in at start-up, so this file is safe to commit.

core_url: http://127.0.0.1:8000

# Liveness reporting. Must stay below the core's 180s staleness window.
heartbeat_seconds: 60

# Minimum score before an observation is published at all. Lower than the core's alert
# threshold on purpose: the core needs mid-confidence events to compute analytics and tune
# thresholds against, and the decision to interrupt a member of staff stays with the core.
publish_floor: 0.35

# Tracking
iou_threshold: 0.25
max_missed_frames: 8
max_track_age_seconds: 180

# ----------------------------------------------------------------------------------
# Backend
# ----------------------------------------------------------------------------------
#
#   synthetic  - generated pose sequences. No dependencies, no video, no real footage.
#                This is the default and is what the demo uses.
#
#   yolo_pose  - real inference. Needs `pip install -r requirements-edge.txt`.
#
# BEFORE SWITCHING TO yolo_pose, READ THIS:
#
#   Do not point this at your employer's CCTV. That footage is the retailer's data and the
#   customers' personal data. Using it for a personal project without written authorisation
#   from the data controller is a UK GDPR breach and a disciplinary matter.
#
#   Lawful options: PoseLift (WACV 2025, anonymised pose data from a real store),
#   UCF-Crime, DCSASS, or footage you recorded yourself with the informed consent of
#   everyone in frame.
#
#   The backend enforces this: a live source without `authorisation_reference` is refused.

backend: synthetic

backend_options:
  fps: 8
  duration_seconds: 300
  seed: 20260912
  max_concurrent_shoppers: 3
  frame_width: 1920
  frame_height: 1080

  # Weighted toward normal shopping, because that is what a real store looks like.
  # A balanced mix would flatter the detector and hide the false-positive rate that
  # actually decides whether staff keep using the tool.
  scenario_weights:
    browse: 0.60      # walks past, looks, moves on
    replace: 0.24     # picks up and puts back: the false positive that matters
    conceal: 0.12     # reach then hand to body and held
    sweep: 0.04       # repeated rapid removal

# ----------------------------------------------------------------------------------
# Real inference settings, used when backend is yolo_pose
# ----------------------------------------------------------------------------------
# backend: yolo_pose
# backend_options:
#   source: ./data/clip.mp4          # a file, or an authorised stream
#   weights: yolo11n-pose.pt
#   confidence: 0.35
#   frame_stride: 3                  # infer on every 3rd frame; 8 fps is plenty
#   imgsz: 640
#   device: null                     # "cpu", "mps", "cuda:0", or null to auto-select
#   # Required for any live source. Record the written authorisation and DPIA reference.
#   authorisation_reference: ""

# ----------------------------------------------------------------------------------
# Cameras
# ----------------------------------------------------------------------------------
# Codes must match those seeded into the core service. `ingest_key` is injected at runtime
# from secrets/edge_credentials.json and must never be written here.

cameras:
  - camera_code: cam-conf-01
    label: Confectionery aisle
  - camera_code: cam-chill-01
    label: Chilled run
  - camera_code: cam-bws-01
    label: Beers, wines and spirits
  - camera_code: cam-hb-01
    label: Health and beauty
  - camera_code: cam-entrance
    label: Entrance overview
  - camera_code: cam-till-01
    label: Till and kiosk
